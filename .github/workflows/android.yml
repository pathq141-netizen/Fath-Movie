name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FathMovie-Release-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-release-${{ github.run_number }}
          name: FathMovie Native Android v1.0.0 (Release Build #${{ github.run_number }})
          body: |
            ### 🎬 FathMovie Native Android Release APK
            Aplikasi Android Native streaming film, serial TV, dan drama pendek.
            
            - **Build Type:** Release (Ringan, Cepat, Tanpa Obfuscation)
            - **Bypass CDN:** Menggunakan header referer resmi, streaming langsung dari CDN tanpa server proxy!
            - **Player:** AndroidX Media3 / ExoPlayer dengan multi-resolusi (360p, 480p, 720p, 1080p).
            - **Commit:** ${{ github.sha }}
            
            Unduh file `.apk` di bawah dan install langsung di HP Android Anda!
          files: |
            android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
